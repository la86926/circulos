    <div class="brand-wrap"><img data-logo src="logo.svg?v=3" alt="" class="brand-icon" width="34" height="34"><h2 class="brand">Círculos<span class="brand-sub"> Music</span></h2></div>
    <div class="theme-switch" role="group" aria-label="Apariencia">
      <button class="theme-choice" data-theme-choice="light" type="button" aria-label="Modo claro" title="Claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg><span>Claro</span></button>
      <button class="theme-choice" data-theme-choice="dark" type="button" aria-label="Modo oscuro" title="Oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg><span>Oscuro</span></button>
      <button class="theme-choice" data-theme-choice="system" type="button" aria-label="Usar apariencia del sistema" title="Sistema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Sistema</span></button>

  </nav>
  <gift-card-widget></gift-card-widget>
</aside>
<main class="container app-view" id="circlesView">
<section class="hero" id="inicio"><div><h1>Círculos de acordes</h1></div></section>
<section class="toolbar"><div class="control-card"><span class="label">Nomenclatura</span><div class="segmented seg2"><button class="seg-btn active" data-nomenclature="english" type="button">Inglés</button><button class="seg-btn" data-nomenclature="latin" type="button">Latina</button></div></div></section>
<section class="panel" id="selector">
  <div class="key-scroller" id="toneSelector"></div>
  <div class="panel-head"><div><h3 class="panel-title">Tonalidad principal</h3></div><label class="minimal-scale-control"><select class="minimal-scale-select" id="minimalScaleSelect" aria-label="Tipo de escala"><option value="major">Mayor</option><option value="minor">Menor natural</option></select><span class="minimal-scale-arrow" aria-hidden="true">⌄</span></label></div>
</section>
<section class="panel harmony-wheel-panel" id="circuloArmonico"><div class="harmony-wheel-wrap"><div class="harmony-wheel-stage" id="harmonyWheel"></div><aside class="harmony-wheel-info"><div class="harmony-wheel-legend"><div class="harmony-wheel-legend-item"><span class="harmony-wheel-dot major"></span><span>Mayor</span></div><div class="harmony-wheel-legend-item"><span class="harmony-wheel-dot minor"></span><span>Menor</span></div><div class="harmony-wheel-legend-item"><span class="harmony-wheel-dot diminished"></span><span>Disminuido</span></div></div></aside></div></section>
<section class="panel" id="instrumento">
  <div class="chord-head"><strong id="circleChordTitle"></strong><div class="chord-actions" id="chordActions"></div></div>
  <div class="instrument-tabs"><div class="segmented seg2"><button class="seg-btn active" data-instrument="guitar" type="button">Guitarra</button><button class="seg-btn" data-instrument="piano" type="button">Piano</button></div></div>
  <div class="instrument-body" id="guitarPanel"><div class="chord-position-grid" id="circleChordPositions" aria-live="polite"></div></div>
  <div class="instrument-body hidden" id="pianoPanel">
    <div class="visual-top"><div class="inversion-wrap"><div class="segmented seg3"><button class="seg-btn active" data-inversion="0" type="button">Fundamental</button><button class="seg-btn" data-inversion="1" type="button">1.ª inversión</button><button class="seg-btn" data-inversion="2" type="button">2.ª inversión</button></div></div><div id="pianoActions" class="piano-actions"></div></div>
    <div class="piano-scroll"><div class="piano" id="pianoKeyboard"></div></div>
    <p class="voicing-note-line">Notas: <strong id="pianoVoicingText"></strong></p>
  </div>
</section>
</main>
<div class="toast" id="toast" role="status"></div>
