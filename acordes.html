<body>
<header class="app-header">
  <div class="header-inner appearance-header">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Abrir menú" aria-controls="sideMenu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7.5h16M4 12h11M4 16.5h16"/></svg></button>
    <div class="brand-wrap"><img data-logo src="logo.svg?v=3" alt="" class="brand-icon" width="34" height="34"><h2 class="brand">Círculos<span class="brand-sub"> Music</span></h2></div>
    <div class="theme-switch" role="group" aria-label="Apariencia">
      <button class="theme-choice" data-theme-choice="light" type="button" aria-label="Modo claro" title="Claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg><span>Claro</span></button>
      <button class="theme-choice" data-theme-choice="dark" type="button" aria-label="Modo oscuro" title="Oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg><span>Oscuro</span></button>
      <button class="theme-choice" data-theme-choice="system" type="button" aria-label="Usar apariencia del sistema" title="Sistema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Sistema</span></button>
    </div>
  </div>
</header>
<div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>

    <div class="side-menu-brand"><img data-logo src="logo.svg?v=3" alt="" width="40" height="40"><div><strong>Círculos Music</strong></div></div>

  </div>
  <nav class="app-picker" aria-label="Herramientas">
    <a class="app-choice" href="index.html"><span class="app-choice-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-opacity=".35"/><circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="4" r="1.7"/><circle cx="18.9" cy="8" r="1.7"/><circle cx="18.9" cy="16" r="1.7"/><circle cx="12" cy="20" r="1.7"/><circle cx="5.1" cy="16" r="1.7"/><circle cx="5.1" cy="8" r="1.7"/></svg></span><strong>Círculos</strong><small>Tonalidades, sus 7 acordes y posiciones.</small></a>
    <a class="app-choice active" href="acordes.html" aria-current="page"><span class="app-choice-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M10.67 4v16M15.33 4v16M20 4v16" stroke-opacity=".5"/><path d="M6 4h14" stroke-width="2.4"/><path d="M6 9h14M6 14h14M6 19h14" stroke-opacity=".3"/><circle class="dot" cx="10.67" cy="11.5" r="2"/><circle class="dot" cx="15.33" cy="16.5" r="2"/><circle class="dot" cx="20" cy="6.5" r="2"/></svg></span><strong>Acordes</strong><small>Biblioteca de acordes de guitarra y piano.</small></a>
  </nav>
  <gift-card-widget></gift-card-widget>
</aside>
<main class="container app-view" id="chordsView">
  <section class="hero library-hero">
    <div>
      <h1>Biblioteca de acordes</h1>
    </div>
  </section>
  <section class="panel chordlib-tools" aria-label="Herramientas de la biblioteca">
    <div class="chordlib-tools-main">
      <label class="chord-search" for="chordSearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="chordSearch" type="search" autocomplete="off" spellcheck="false" placeholder="Busca Cmaj7, DO menor 7, F#m7…">
      </label>
      <div class="chord-notation"><span class="label">Nomenclatura</span><div class="segmented seg2"><button class="seg-btn active" data-library-notation="english" type="button">Inglés</button><button class="seg-btn" data-library-notation="latin" type="button">Latina</button></div></div>
    </div>
    <div class="chordlib-filter-row">
      <div class="chord-filter-block"><span class="chord-filter-label">Nota</span><div class="chord-root-scroller" id="chordRootFilters" aria-label="Filtrar por nota"></div></div>
      <label class="chord-filter-block"><span class="chord-filter-label">Familia</span><select class="chord-select" id="chordFamilyFilter"><option value="all">Todas las familias</option></select></label>
    </div>
  </section>
  <section class="chordlib-results" aria-labelledby="chordCatalogTitle">
    <div class="chord-results-head"><div class="results-title"><h2 id="chordCatalogTitle">Acordes</h2><div class="segmented seg2 lib-inst" role="group" aria-label="Instrumento"><button class="seg-btn active" type="button" data-library-inst="guitar" aria-pressed="true">Guitarra</button><button class="seg-btn" type="button" data-library-inst="piano" aria-pressed="false">Piano</button></div></div><button class="chord-reset" id="chordResetFilters" type="button">Limpiar filtros</button></div>
    <div class="chord-catalog-grid" id="chordCatalogGrid" aria-live="polite"></div>
    <div class="chord-empty" id="chordEmpty" hidden><strong>Sin coincidencias</strong><span>Prueba otra nota, familia o búsqueda.</span></div>
    <button class="chord-load-more" id="chordLoadMore" type="button" hidden>Mostrar más</button>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
